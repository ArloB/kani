codecov:
  notify:
    wait_for_ci: true   # post Codecov check only after other CI jobs finish

coverage:
  status:
    project:
      default:
        target: auto    # must not drop below the base branch
        threshold: 1%   # allow up to 1% drift before failing
    patch:
      default:
        target: 50%     # new/changed lines in a PR should be ≥50% covered

component_management:
  individual_components:
    - component_id: evaluator
      paths:
        - kani-core/src/evaluator/**
      statuses:
        - type: project
          target: 60%
    - component_id: service
      paths:
        - kani-app/src/service/**
      statuses:
        - type: project
          target: 50%

ignore:
  - "migrations/**"
  - "static/**"
  - "kani-extensions/kani-example/**"
  - "kani-extensions/kani-test-abi/**"

comment:
  layout: "header, diff, components, files"
  behavior: default
  require_changes: true  # skip comment if coverage is unchanged
