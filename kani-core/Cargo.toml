[package]
name = "kani-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
kani-shared = { path = "../kani-shared", features = ["host"] }

# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }
futures.workspace = true
tokio-util = { workspace = true, features = ["compat"] }

# HTTP client
rquest = { version = "5.1.0", features = ["json"] }
rquest-util = "2.2.1"

# WASM runtime
wasmtime = { version = "41.0.2", features = ["async", "component-model"] }
wit-bindgen = "0.53.1"

# Serialization
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1", features = ["alloc"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }

# HTML parsing (for extensions)
scraper = "0.25.0"

# Error handling
thiserror.workspace = true

# Archive handling
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
async_zip = { version = "0.0.18", features = ["tokio"] }
dunce = "1"

# Logging
tracing.workspace = true

bytes.workspace = true
arc-swap = "1.8.2"
ego-tree = "^0.10.0"
hickory-resolver = "0.25.2"
dashmap.workspace = true
publicsuffix = "2.3.0"
url = "2.5.8"
urlencoding.workspace = true
time = { workspace = true, features = ["parsing"] }
regex = "1.12.3"
rand = "0.10.0"


[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }
tokio-test = "0.4"
wiremock = "0.6"