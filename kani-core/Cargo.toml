[package]
name = "kani-core"
version = "0.9.0-rc.1"
license.workspace = true
repository.workspace = true
edition = "2024"
build = "build.rs"

[lints.clippy]
unwrap_used = { level = "deny", priority = 1 }

[features]
test-util = []

[dependencies]
kani-shared = { path = "../kani-shared", features = ["host"] }

# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros", "process"] }
futures.workspace = true
tokio-util = { workspace = true, features = ["compat"] }

# HTTP client
rquest = { version = "5.1.0", features = ["json"] }
rquest-util = "2.2.1"
governor.workspace = true

# WASM runtime
wasmtime = { version = "46.0.1", features = ["async", "component-model"] }
wit-bindgen = "0.58.0"

# Serialization
serde.workspace = true
serde_json.workspace = true
postcard = { version = "1", features = ["alloc"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
base64 = "0.22"
sha2.workspace = true

# HTML parsing (for extensions)
scraper = "0.25.0"

# Error handling
thiserror.workspace = true

# Archive handling
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
async_zip = { version = "0.0.18", features = ["tokio"] }
dunce = "1"

# Image dimension reading and pixel sampling (spread detection at CBZ creation)
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Scripting
rhai = { version = "1.19", features = ["sync"] }

# Logging
tracing.workspace = true
async-trait = "0.1"

bytes.workspace = true
arc-swap = "1.8.2"
ego-tree = "^0.10.0"
hickory-resolver = "0.25.2"
dashmap.workspace = true
publicsuffix = "2.3.0"
url = "2.5.8"
urlencoding.workspace = true
time = { workspace = true, features = ["parsing"] }
regex = "1.12.3"
rand = "0.10.0"
blake3 = "1.8.5"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
kani-shared = { path = "../kani-shared", features = ["builder"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }
tokio-test = "0.4"
wiremock = "0.6"

[[bench]]
name = "blueprint_eval"
harness = false
