[package]
name = "kani-web"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ── Always present (both SSR + hydrate) ──────────────────────────────────
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde", "std"] }
urlencoding = "2.1"

# ── SSR-only (native server binary) ───────────────────────────────────────
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = [
  "compression-full",
  "set-header",
], optional = true }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "sqlite",
  "chrono",
], optional = true }
rquest = { version = "5.1", features = ["json"], optional = true }
rquest-util = { version = "2.2", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
kani-core = { path = "../kani-core", optional = true }
kani-shared = { path = "../kani-shared", optional = true }

bytes = { version = "1.11.1", optional = true }
futures = { version = "0.3.32", optional = true }
indexmap = { version = "2.13.0", optional = true }
ordered-float = { version = "5.1.0", optional = true }
moka = { version = "0.12.14", optional = true, features = ["future"] }
chacha20poly1305 = { version = "0.10.1", optional = true }
sha2 = { version = "0.10.9", optional = true }
hmac = { version = "0.12.1", optional = true }
rand = { version = "0.10.0", optional = true }
base64 = { version = "0.22.1", optional = true }
hex = { version = "0.4.3", optional = true }
dashmap = { version = "6.1.0", optional = true }
pulldown-cmark = { version = "0.13.1", default-features = false, features = ["html"], optional = true }
ammonia = { version = "4.1.2", optional = true }

# ── Hydrate-only (browser WASM) ──────────────────────────────────────────
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
  "EventSource",
  "MessageEvent",
  "EventTarget",
  "Event",
  "ErrorEvent",
  "Window",
  "Storage",
], optional = true }
gloo-timers = { version = "0.3.0", features = ["futures"], optional = true }

[features]
hydrate = [
  "leptos/hydrate",
  "dep:wasm-bindgen",
  "dep:console_error_panic_hook",
  "dep:console_log",
  "dep:log",
  "dep:web-sys",
  "dep:gloo-timers",
]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:leptos_axum",
  "dep:axum",
  "dep:tokio",
  "dep:tower-http",
  "dep:sqlx",
  "dep:rquest",
  "dep:rquest-util",
  "dep:xxhash-rust",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:tokio-stream",
  "dep:kani-core",
  "dep:kani-shared",
  "dep:bytes",
  "dep:futures",
  "dep:indexmap",
  "dep:ordered-float",
  "dep:moka",
  "dep:chacha20poly1305",
  "dep:sha2",
  "dep:hmac",
  "dep:rand",
  "dep:base64",
  "dep:hex",
  "dep:dashmap",
  "dep:pulldown-cmark",
  "dep:ammonia",
]

[package.metadata.leptos]
output-name = "kani-web"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:8242"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
