[package]
name = "kani-web"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
test-util = ["kani-app/test-util"]
# Passkeys/WebAuthn deferred — see overviews plan. The audited server crate
# (webauthn-rs) pulls OpenSSL, which conflicts at link time with rquest's
# bundled BoringSSL (boring2). A hand-rolled verifier was rejected as unsafe for
# an auth feature. The recommended path is the pure-RustCrypto `webauthn_rp`
# crate (no OpenSSL/ring/boring) — to be implemented when passkeys are revisited.

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "macros", "parsing"] }
paste = "1.0.15"
kani-shared = { path = "../kani-shared", features = ["ssr"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "signal"] }
tokio-util.workspace = true
tower-http = { version = "0.6", features = [
  "compression-gzip",
  "compression-br",
  "cors",
  "fs",
  "set-header",
  "trace",
] }
sqlx.workspace = true
rquest = { version = "5.1", features = ["json"] }
rquest-util = "2.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
kani-core = { path = "../kani-core" }
kani-app  = { path = "../kani-app" }
bytes.workspace = true
futures.workspace = true
indexmap.workspace = true
ordered-float.workspace = true
moka.workspace = true
chacha20poly1305 = "0.10.1"
sha2 = "0.10.9"
hmac = "0.12.1"
secrecy = { version = "0.8", features = ["alloc", "serde"] }
rand = "0.10.0"
base64.workspace = true
hex = "0.4.3"
uuid = { version = "1", features = ["v4"] }
dashmap.workspace = true
pulldown-cmark = { version = "0.13.1", default-features = false, features = ["html"] }
ammonia = "4.1.2"
axum-login = "0.18"
argon2 = { version = "0.5.3", features = ["std"] }
dirs = "6.0.0"
tower-sessions-sqlx-store = { version = "0.15", default-features = false, features = ["sqlite"] }
garde = { version = "0.22", features = ["derive"] }
urlencoding.workspace = true
tower_governor = "0.6"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3.27.0"
http-body-util = "0.1"
kani-app = { path = "../kani-app", features = ["test-util"] }
kani-shared-test = { path = "../kani-shared-test" }
moka = { workspace = true }
async-trait = "0.1"
