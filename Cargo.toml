[workspace]
resolver = "3"
members = ["kani-core", "kani-shared", "kani-extensions/*", "kani-web", "kani-app", "kani-cli"]

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 256
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Debug WASM profile: preserves function names for readable backtraces.
# Use with: cargo run -p kani-cli -- build --debug <extension>
[profile.wasm-debug]
inherits = "wasm-release"
opt-level = 1
debug = true
strip = "none"
debug-assertions = true

[workspace.dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
thiserror   = "2.0"
tracing     = "0.1"
time        = { version = "0.3", features = ["serde"] }
sqlx        = { version = "0.8", features = ["runtime-tokio", "sqlite", "time"], default-features = false }
dashmap     = "6"
moka        = { version = "0.12", features = ["future"] }
indexmap    = "2"
base64      = "0.22"
futures     = "0.3"
bytes       = "1"
tokio-util  = "0.7"
urlencoding = "2.1"
ordered-float = "5"

[workspace.lints.clippy]
unwrap_used = { level = "deny", priority = 1 }
pedantic = "warn"
nursery = "warn"
