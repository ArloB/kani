[package]
name = "kani"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["kani-core", "kani-shared", "kani-mangadex"]

[dependencies]
# Workspace crates
kani-core = { path = "kani-core" }
kani-shared = { path = "kani-shared" }

# Web server
axum = { version = "0.8.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs"] }

# Database
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }

# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# HTTP client (for handler-level requests)
rquest = { version = "5.1.0", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0.18"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
