[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Archives + checksums only. Kani is a server: a shell installer that drops a
# binary into CARGO_HOME is the wrong shape for it.
installers = []
# Target platforms to build apps for (Rust target-triple syntax).
#
# All of these are built on native runners rather than cross-compiled. musl and
# aarch64-unknown-linux-gnu are deliberately absent: rquest links BoringSSL (a
# cmake/C++ dependency), which makes those the only genuinely risky targets.
# Add them once a real tag has proven they build.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Build with `-p kani-web -p kani-cli` rather than `--workspace`. The
# kani-extensions/* crates are WASM-only (gated behind target_family = "wasm")
# and fail to compile natively, which is why default-members excludes them; a
# --workspace build drags them in and breaks the release.
precise-builds = true
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# kani-web's build.rs shells out to node (esbuild) and the tailwind CLI, so every
# build runner needs node available before cargo runs.
github-build-setup = "build-setup.yml"
# Multi-arch image build + keyless cosign signing, as a reusable workflow.
publish-jobs = ["./docker"]
