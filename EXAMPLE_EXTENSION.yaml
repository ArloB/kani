id: mangapill-gen
name: Mangapill
version: "0.1.0"
base_url: "https://mangapill.com"
language: multi
nsfw: false
unrestricted_http: false

endpoints:

  popular:
    delegate_to: search
    empty_without_filters: true

  search:
    route: "/search"
    queries:
      q: $query$
    filter_mapping:
      genre: genre
      type: type
      status: status
    pagination:
      native_page_size: 50
      offset_param: "page"
      offset_type: page
      page_start: 1
    # total_pages: 'doc.first(".pagination").attr("data-last-page").parse_int()'
    # total_pages: 120   # static value (optional field — omit if unknown)
    container: ".grid.gap-3 > div"
    fields:
      id: 'self.first("a").attr("href").split("/").at(2)'
      title: 'self.first(".line-clamp-2").text()'
      # Use `if/then/else` to normalise relative and absolute cover URLs.
      cover_url:
        expr: |
          let $src = self.first("img").attr("data-src").fallback(self.first("img").attr("src"))
          if $src.starts_with("http") then $src else "https://mangapill.com".append($src)
        optional: true

  manga_details:
    route: "/manga/$manga_id$"
    container: ":root"
    fields:
      id: '"$manga_id$"'
      title: 'dom("h1.font-bold").text()'
      description:
        expr: 'dom("p.text-sm").text()'
        optional: true
      status: |
        dom("div.grid:nth-child(3) > div:nth-child(2) > div:nth-child(2)")
          .text().trim().lower()
          .lookup({
            "publishing": "ongoing",
            "finished": "completed",
            "on hiatus": "hiatus",
            "discontinued": "cancelled",
            "not yet published": "hiatus"
          })
          .fallback("unknown")
      # Static list literal — Mangapill does not expose author/artist data.
      authors: '["Unknown"]'
      artists: '["Unknown"]'
      # `capture().at(1)` extracts a specific regex group; `join()` collapses
      # the result list to a comma-separated display string.
      tags:
        expr: 'self.select("div.mb-3 a.text-sm").map($item.text().trim()).filter($item.matches("[^\s]")).join(", ")'
        optional: true
      cover_url:
        expr: 'dom("img").attr("data-src")'
        optional: true

  chapter_list:
    route: "/manga/$manga_id$"
    container: "div.grid a.border"
    has_next_page: false
    # total_pages: 'doc.first(".pagination").attr("data-total").parse_int()'
    fields:
      id: 'self.attr("href").split("/").at(2)'
      number: 'self.text().trim().split(" ").at(-1).parse_float().fallback(0.0)'
      title:
        expr: "null"
        optional: true
      volume:
        expr: "null"
        optional: true
      scanlator:
        expr: "null"
        optional: true
      date_uploaded:
        expr: "null"
        optional: true
      language: '"en"'

  pages:
    route: "/chapters/$chapter_id$"
    container: "img.js-page"
    fields:
      index: "index()"
      url: 'self.attr("data-src")'


filters:
  - { id: "genre:Action",        name: "Action",        type: checkbox }
  - { id: "genre:Adventure",     name: "Adventure",     type: checkbox }
  - { id: "genre:Cars",          name: "Cars",          type: checkbox }
  - { id: "genre:Comedy",        name: "Comedy",        type: checkbox }
  - { id: "genre:Dementia",      name: "Dementia",      type: checkbox }
  - { id: "genre:Demons",        name: "Demons",        type: checkbox }
  - { id: "genre:Doujinshi",     name: "Doujinshi",     type: checkbox }
  - { id: "genre:Drama",         name: "Drama",         type: checkbox }
  - { id: "genre:Ecchi",         name: "Ecchi",         type: checkbox }
  - { id: "genre:Fantasy",       name: "Fantasy",       type: checkbox }
  - { id: "genre:Game",          name: "Game",          type: checkbox }
  - { id: "genre:Gender Bender", name: "Gender Bender", type: checkbox }
  - { id: "genre:Harem",         name: "Harem",         type: checkbox }
  - { id: "genre:Historical",    name: "Historical",    type: checkbox }
  - { id: "genre:Horror",        name: "Horror",        type: checkbox }
  - { id: "genre:Isekai",        name: "Isekai",        type: checkbox }
  - { id: "genre:Josei",         name: "Josei",         type: checkbox }
  - { id: "genre:Kids",          name: "Kids",          type: checkbox }
  - { id: "genre:Magic",         name: "Magic",         type: checkbox }
  - { id: "genre:Martial Arts",  name: "Martial Arts",  type: checkbox }
  - { id: "genre:Mecha",         name: "Mecha",         type: checkbox }
  - { id: "genre:Military",      name: "Military",      type: checkbox }
  - { id: "genre:Music",         name: "Music",         type: checkbox }
  - { id: "genre:Mystery",       name: "Mystery",       type: checkbox }
  - { id: "genre:Parody",        name: "Parody",        type: checkbox }
  - { id: "genre:Police",        name: "Police",        type: checkbox }
  - { id: "genre:Psychological", name: "Psychological", type: checkbox }
  - { id: "genre:Romance",       name: "Romance",       type: checkbox }
  - { id: "genre:Samurai",       name: "Samurai",       type: checkbox }
  - { id: "genre:School",        name: "School",        type: checkbox }
  - { id: "genre:Sci-Fi",        name: "Sci-Fi",        type: checkbox }
  - { id: "genre:Seinen",        name: "Seinen",        type: checkbox }
  - { id: "genre:Shoujo",        name: "Shoujo",        type: checkbox }
  - { id: "genre:Shoujo Ai",     name: "Shoujo Ai",     type: checkbox }
  - { id: "genre:Shounen",       name: "Shounen",       type: checkbox }
  - { id: "genre:Shounen Ai",    name: "Shounen Ai",    type: checkbox }
  - { id: "genre:Slice of Life", name: "Slice of Life", type: checkbox }
  - { id: "genre:Space",         name: "Space",         type: checkbox }
  - { id: "genre:Sports",        name: "Sports",        type: checkbox }
  - { id: "genre:Super Power",   name: "Super Power",   type: checkbox }
  - { id: "genre:Supernatural",  name: "Supernatural",  type: checkbox }
  - { id: "genre:Thriller",      name: "Thriller",      type: checkbox }
  - { id: "genre:Tragedy",       name: "Tragedy",       type: checkbox }
  - { id: "genre:Vampire",       name: "Vampire",       type: checkbox }
  - { id: "genre:Yaoi",          name: "Yaoi",          type: checkbox }
  - { id: "genre:Yuri",          name: "Yuri",          type: checkbox }

  - id: type
    name: Type
    type: select
    options:
      - { name: All,        value: "" }
      - { name: Manga,      value: manga }
      - { name: Manhua,     value: manhua }
      - { name: Novel,      value: novel }
      - { name: One-Shot,   value: one-shot }
      - { name: Doujinshi,  value: doujinshi }
      - { name: OEL,        value: oel }
    default: { name: All, value: "" }

  - id: status
    name: Status
    type: select
    options:
      - { name: All,               value: "" }
      - { name: Ongoing,           value: publishing }
      - { name: Completed,         value: finished }
      - { name: On Hiatus,         value: "on+hiatus" }
      - { name: Discontinued,      value: discontinued }
      - { name: Not Yet Published, value: "not+yet+published" }
    default: { name: All, value: "" }

preferences: []

# Optional. When set, provides the canonical URL for a manga on the source site.
# Use $manga_id$ as a placeholder for the manga's ID.
get_url: "https://mangapill.com/manga/$manga_id$"
