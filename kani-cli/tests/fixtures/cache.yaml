id: test-cache
name: TestCache
version: "0.1.0"
base_url: "https://example.com"
language: en

cache:
  search_results:
    scope: extension
    ttl: 1800
    max_entries: 200
    key_template: "search:{query}:{page}"
  user_prefs:
    scope: user

endpoints:
  manga_details:
    route: "/manga/$manga_id$"
    container: ":root"
    fields:
      id: '"$manga_id$"'
      title: 'dom("h1").text()'
      status: 'dom(".status").text().lower()'
