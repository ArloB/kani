[package]
name = "kani-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "kani_cli"
path = "src/lib.rs"

[[bin]]
name = "kani-cli"
path = "src/main.rs"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"

[dependencies]
clap        = { version = "4", features = ["derive"] }
thiserror   = "2.0"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
tar         = "0.4"
flate2      = "1"
chumsky     = "1.0.0-alpha.8"
kani-shared = { path = "../kani-shared", features = ["builder"] }
kani-yaml   = { path = "../kani-yaml" }
reqwest   = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
sha2.workspace = true
ed25519-dalek.workspace = true
base64    = "0.22"
hex       = "0.4"
semver    = "1"
ariadne   = "0.6.0"
resvg     = "0.44"
tiny-skia = "0.11"
rhai      = { version = "1.19", features = ["sync"] }
