[package]
name = "kani-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
kani-core   = { path = "../kani-core" }
kani-shared = { path = "../kani-shared", features = ["ssr"] }

serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
thiserror     = "2.0"
urlencoding   = "2.1"
tokio         = { version = "1", features = ["full"] }
tokio-util    = "0.7"
sqlx          = { version = "0.8", features = ["runtime-tokio", "sqlite", "time"], default-features = false }
rquest        = { version = "5.1", features = ["json"] }
tracing       = "0.1"
futures       = "0.3"
indexmap      = "2"
ordered-float = "5"
moka          = { version = "0.12", features = ["future"] }
dashmap       = "6"
time          = { version = "0.3", features = ["serde"] }
base64        = "0.22"
sha2          = "0.10"
rand          = "0.10"
hex           = "0.4"
async-trait   = "0.1"
