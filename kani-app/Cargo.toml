[package]
name = "kani-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lints.clippy]
unwrap_used = { level = "deny", priority = 1 }

[dependencies]
kani-core   = { path = "../kani-core" }
kani-shared = { path = "../kani-shared", features = ["ssr"] }
kani-yaml   = { path = "../kani-yaml" }
wasmtime    = { version = "46.0.1", features = ["async", "component-model"] }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
urlencoding.workspace = true
tokio         = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
tokio-util.workspace = true
sqlx.workspace = true
rquest        = { version = "5.1", features = ["json"] }
tracing.workspace = true
futures.workspace = true
indexmap.workspace = true
ordered-float.workspace = true
moka.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
time          = { workspace = true, features = ["serde", "serde-well-known", "formatting", "macros"] }
base64.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
hmac          = "0.12"
chacha20poly1305 = "0.10.1"
rand          = "0.10"
hex           = "0.4"
secrecy       = { version = "0.8", features = ["alloc", "serde"] }
totp-rs       = { version = "5", features = ["qr", "gen_secret"] }
argon2        = "0.5"
infer         = "0.16"
zxcvbn        = "3"
sha1          = "0.10"
async-trait   = "0.1"
paste         = "1.0.15"
semver        = "1"
uuid          = { version = "1", features = ["v4", "serde"] }
lettre        = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
image         = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
zip           = "2"
flate2        = "1"
prost         = "0.13"
strsim        = "0.11"
epub-builder  = "0.7"
quick-xml     = "0.39.2"
which         = "6"
tempfile      = "3"
fs2           = "0.4"
dunce         = "1"

[features]
test-util = ["kani-core/test-util"]

[dev-dependencies]
kani-core        = { path = "../kani-core", features = ["test-util"] }
kani-shared      = { path = "../kani-shared", features = ["ssr"] }
kani-shared-test = { path = "../kani-shared-test" }
tokio-util  = { workspace = true }
tokio = { version = "1", features = ["net"] }
ed25519-dalek.workspace = true

[build-dependencies]
prost-build = "0.14.3"
protox = "0.9.1"

