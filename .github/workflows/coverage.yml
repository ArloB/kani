name: Coverage

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools, wasm-opt

      # Build dev/test WASM extensions so kani-core WASM tests are included
      # in coverage (they skip gracefully if the WASM binaries are missing).
      - name: Build dev/test WASM extensions
        run: cargo run -p kani-cli -- build --dev

      - name: Collect coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
