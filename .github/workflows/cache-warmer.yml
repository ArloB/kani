name: Cache Warmer

on:
  push:
    branches: [develop]

concurrency:
  group: cache-warmer
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  warm:
    name: Warm Rust cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Build workspace (populate cache)
        run: cargo build --locked

      - name: Cache kani-cli binary
        uses: actions/cache@v5
        id: kani-cli-cache
        with:
          path: target/release/kani-cli
          key: kani-cli-${{ runner.os }}-${{ hashFiles('kani-cli/**', 'kani-shared/**', 'Cargo.lock') }}

      - name: Build kani-cli
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p kani-cli
