name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools, wasm-opt, nextest

      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
          fallback: cargo-install

      - name: Cache kani-cli binary
        uses: actions/cache@v4
        id: kani-cli-cache
        with:
          path: target/release/kani-cli
          key: kani-cli-${{ runner.os }}-${{ hashFiles('kani-cli/**', 'kani-shared/**', 'Cargo.lock') }}

      - name: Build kani-cli
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p kani-cli

      - name: Build dev/test WASM extensions
        run: ./target/release/kani-cli build --dev

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo nextest run --locked

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Check sqlx offline data
        env:
          DATABASE_URL: sqlite:ci-check.db
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check --workspace
