name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'kani-core/wit/**'
              - '.github/workflows/ci.yml'
            js:
              - 'static/js/**'
              - '!static/js/dist/**'
              - '!static/js/vendor/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'static/js/**'
              - '!static/js/dist/**'
              - '!static/js/vendor/**'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --no-deps -- -D warnings

      - name: Check optional error-reporting feature
        run: cargo check --locked -p kani-web --features error-reporting
        env:
          SQLX_OFFLINE: "true"

      # Benches are not run in CI (a shared runner gives meaningless numbers), but
      # they must keep compiling. No --workspace: kani-extensions/* are WASM-only.
      - name: Check benchmarks compile
        run: cargo bench --locked --no-run
        env:
          SQLX_OFFLINE: "true"

      # The release workflow is generated from dist-workspace.toml. Regenerate it
      # (`dist generate`) whenever that config changes, or releases silently drift.
      - name: Check release workflow is in sync with dist config
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          dist generate --check

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools, wasm-opt, nextest, cargo-binstall

      - name: Install sqlx-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test -f "$HOME/.cargo/bin/cargo-sqlx" || cargo binstall sqlx-cli --no-confirm --no-symlinks --force

      - name: Restore kani-cli binary
        uses: actions/cache/restore@v5
        id: kani-cli-cache
        with:
          path: target/release/kani-cli
          key: kani-cli-${{ runner.os }}-${{ hashFiles('kani-cli/**', 'kani-shared/**', 'Cargo.lock') }}

      - name: Build kani-cli
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p kani-cli

      - name: Save kani-cli binary
        uses: actions/cache/save@v5
        if: always()
        with:
          path: target/release/kani-cli
          key: kani-cli-${{ runner.os }}-${{ hashFiles('kani-cli/**', 'kani-shared/**', 'Cargo.lock') }}

      - name: Restore WASM extensions
        uses: actions/cache/restore@v5
        id: wasm-cache
        with:
          path: wasm_sources/
          key: wasm-${{ runner.os }}-${{ hashFiles('kani-extensions/**', 'kani-shared/**', 'kani-core/wit/**', 'kani-cli/**', 'Cargo.lock') }}

      - name: Build dev/test WASM extensions
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: ./target/release/kani-cli build --dev

      - name: Save WASM extensions
        uses: actions/cache/save@v5
        if: always()
        with:
          path: wasm_sources/
          key: wasm-${{ runner.os }}-${{ hashFiles('kani-extensions/**', 'kani-shared/**', 'kani-core/wit/**', 'kani-cli/**', 'Cargo.lock') }}

      - name: Test
        run: cargo nextest run --locked --profile ci

      - name: Check sqlx offline data
        env:
          DATABASE_URL: sqlite:///tmp/kani-ci-check.db?mode=rwc
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check --workspace -- --all-targets --tests

  js:
    name: JS
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check JS syntax
        run: find static/js -name '*.js' -not -path '*/dist/*' -not -path '*/vendor/*' -print0 | xargs -0 node --check

      - name: Unit tests (pure JS modules)
        run: node --test "static/js/**/*.test.js"

      - name: Restore kani-cli binary
        uses: actions/cache/restore@v5
        id: kani-cli-cache
        with:
          path: target/release/kani-cli
          key: kani-cli-${{ runner.os }}-${{ hashFiles('kani-cli/**', 'kani-shared/**', 'Cargo.lock') }}

      - name: Install mold linker
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Build kani-cli
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p kani-cli

      # Zero-tolerance: the semantic-colour migration is complete, so any new
      # hard-coded colour literal fails CI. Intentional literals (the pure-black
      # reader, scrims, contrast text) carry a `// audit-ignore` directive, and
      # the colour-palette module uses `audit-ignore-file`.
      - name: Audit hard-coded colour tokens
        run: ./target/release/kani-cli audit-tokens --check --max 0

  docs:
    name: Docs & i18n
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build docs (strict)
        run: cd docs && mkdocs build --strict

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !SPECIFICATION.md
          config: ".markdownlint.yml"

      - name: i18n key check
        run: node scripts/check-i18n-keys.js

      - name: Untranslated string check
        run: node scripts/check-untranslated-strings.js
