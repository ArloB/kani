name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      js: ${{ steps.filter.outputs.js }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'kani-core/wit/**'
              - '.github/workflows/ci.yml'
            js:
              - 'static/js/**'
              - '!static/js/dist/**'
              - '!static/js/vendor/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'static/js/**'
              - '!static/js/dist/**'
              - '!static/js/vendor/**'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --no-deps -- -D warnings

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
          df -h

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci"
          cache-on-failure: true

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools, wasm-opt, nextest, cargo-binstall

      - name: Install sqlx-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test -f "$HOME/.cargo/bin/cargo-sqlx" || cargo binstall sqlx-cli --no-confirm --no-symlinks --force

      - name: Cache kani-cli binary
        uses: actions/cache@v5
        id: kani-cli-cache
        with:
          path: target/release/kani-cli
          key: kani-cli-${{ runner.os }}-${{ hashFiles('kani-cli/**', 'kani-shared/**', 'Cargo.lock') }}
          save-always: true

      - name: Build kani-cli
        if: steps.kani-cli-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p kani-cli

      - name: Cache WASM extensions
        uses: actions/cache@v5
        id: wasm-cache
        with:
          path: wasm_sources/
          key: wasm-${{ runner.os }}-${{ hashFiles('kani-extensions/**', 'kani-shared/**', 'kani-core/wit/**', 'kani-cli/**', 'Cargo.lock') }}
          save-always: true

      - name: Build dev/test WASM extensions
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: ./target/release/kani-cli build --dev

      - name: Test
        run: cargo nextest run --locked --profile ci

      - name: Check sqlx offline data
        env:
          DATABASE_URL: sqlite:///tmp/kani-ci-check.db?mode=rwc
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run
          cargo sqlx prepare --check --workspace -- --all-targets --tests

  js:
    name: JS
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check JS syntax
        run: find static/js -name '*.js' -not -path '*/dist/*' -not -path '*/vendor/*' -print0 | xargs -0 node --check

  docs:
    name: Docs & i18n
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build docs (strict)
        run: cd docs && mkdocs build --strict

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !SPECIFICATION.md
          config: ".markdownlint.yml"

      - name: i18n key check
        run: node scripts/check-i18n-keys.js
