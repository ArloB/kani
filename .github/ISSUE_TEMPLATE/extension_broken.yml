name: Extension broken
description: An extension is failing to fetch manga, chapters, or pages
labels: ["extension", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Extensions talk to external websites. If the website changed its structure, the extension may need to be updated — this is usually not a Kani bug.

  - type: input
    id: extension
    attributes:
      label: Extension name
      placeholder: e.g. kani-weebcentral
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in Sources → source details.
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: Which action fails?
      options:
        - Browse / search
        - Manga details
        - Chapter list
        - Page load
        - All actions
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happens?
      description: Describe the failure — error message, empty results, timeout, etc.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server logs (optional)
      description: Paste relevant lines from Settings → Admin → Logs.
      render: text
