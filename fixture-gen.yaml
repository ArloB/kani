id: fixture-gen
name: FixtureGen
version: "0.1.0"
base_url: "https://fixture.invalid"
language: en
nsfw: false
unrestricted_http: true

option_sets:
  genres:
    - name: Action
      value: action
    - name: Comedy
      value: comedy

filters:
  - id: genre
    name: Genre
    type: multiselect
    options_ref: genres

endpoints:
  popular:
    route: "/popular"
    container: ".item"
    has_next_page: false
    fields:
      id: 'self.attr("data-id")'
      title: 'self.first(".title").text()'

  search:
    route: "/search"
    queries:
      q: $query$
    filter_mapping:
      genre: genre
    pagination:
      native_page_size: 20
      offset_param: "page"
      offset_type: page
      page_start: 1
    container: ".item"
    fields:
      id: 'self.attr("data-id")'
      title: 'self.first(".title").text()'

  manga_details:
    route: "/manga/$manga_id$"
    container: ".manga"
    fields:
      id: '"$manga_id$"'
      title: 'self.first("h1").text()'
      status: '"unknown"'
      authors: '[]'
      artists: '[]'
      tags: '[]'

  chapter_list:
    route: "/manga/$manga_id$/chapters"
    container: ".ch"
    has_next_page: false
    fields:
      id: 'self.attr("data-id")'
      number: '0.0'
      title:
        expr: 'self.first(".title").text()'
        optional: true
      language: '"en"'

  pages:
    route: "/manga/$manga_id$/chapter/$chapter_id$"
    container: ".page"
    fields:
      index: "index()"
      url: 'self.attr("data-url")'

preferences: []
