services:
  kani:
    build:
      context: .
      # args:
      #   Uncomment to include Chromium + puppeteer-core (~250 MB extra).
      #   Required for browser-based extensions such as kani-comix.
      #   INSTALL_BROWSER: "true"

      #   Uncomment to include Kindle Comic Converter for MOBI/AZW3 export.
      #   INSTALL_KCC: "true"
    image: kani:latest
    ports:
      - "8242:8242"
    volumes:
      # Database and WASM extensions.
      # The kani user inside the container runs as UID 1000.
      # If using a bind mount and you hit permission errors, run:
      #   sudo chown -R 1000:1000 ./data
      - ./data:/data

      # Manga image library. This is kept separate so it can be placed on a
      # different drive or filesystem on the host. To use a custom path, replace
      # the left-hand side with an absolute path, e.g.:
      #   - /mnt/large-drive/manga:/library
      - ./library:/library

    environment:
      KANI_BIND: "0.0.0.0:8242"

      # Set to "true" when running behind a TLS-terminating reverse proxy (Caddy, nginx, etc.)
      # so that session cookies are marked Secure.
      KANI_SECURE_COOKIES: "false"

      # Restrict CORS to a specific origin in production.
      # Leave unset to mirror the request origin (permissive, suitable for local use).
      # KANI_CORS_ORIGIN: "https://kani.example.com"

      # Override the log level (error, warn, info, debug, trace).
      # RUST_LOG: "info"

      # Emit structured JSON logs instead of human-readable text ("text" | "json").
      # KANI_LOG_FORMAT: "json"

      # Warn-log any SQL statement slower than this many milliseconds.
      # KANI_SLOW_QUERY_THRESHOLD_MS: "100"

      # Prometheus metrics are exposed unauthenticated at /metrics. Set a token to
      # require "Authorization: Bearer <token>" on that endpoint.
      # KANI_METRICS_TOKEN: "change-me"

      # Set to "false" to disable browser-based extension features at runtime,
      # even if Chromium is installed (e.g. to reclaim memory on idle servers).
      # KANI_BROWSER_ENABLED: "false"

      # Override the Chromium binary path if not at the default /usr/bin/chromium.
      # CHROMIUM_PATH: "/usr/bin/chromium-browser"

      # How long (ms) to keep the Chromium process alive after all pages close.
      # Defaults to 300000 (5 min). Set to 0 to keep it alive indefinitely.
      # Lower values save RAM on idle servers at the cost of a ~2 s relaunch delay.
      # BROWSER_IDLE_TIMEOUT_MS: "120000"

      # ── Credential encryption ────────────────────────────────────────────────
      # Encrypts SMTP password and OAuth tokens at rest with ChaCha20-Poly1305.
      # If neither variable is set, a key is auto-provisioned to /data/secret.key
      # on first boot. Back that file up alongside kani.db — losing it means
      # losing access to any stored credentials (trackers, SMTP, etc.).
      #
      # To use a fixed key (e.g. from a secret manager):
      #   Generate: openssl rand -hex 32
      # KANI_SECRET_KEY: ""
      #
      # Or load from a Docker secret (recommended for production):
      # KANI_SECRET_KEY_FILE: "/run/secrets/kani_secret_key"

      # ── Image proxy ──────────────────────────────────────────────────────────
      # Signs cover-image proxy URLs. Auto-provisioned to /data/proxy.key on
      # first boot — no action needed unless you want a fixed key across restarts.
      # KANI_PROXY_SECRET: ""   # base64url-encoded 32 bytes

      # ── Auth / rate limiting ─────────────────────────────────────────────────
      # How long a session stays alive after last activity. Default: 30 days.
      # KANI_SESSION_TIMEOUT_SECONDS: "2592000"

      # Failed-login lockout: max attempts per identity before a 15-minute block.
      # KANI_MAX_LOGIN_ATTEMPTS: "5"

      # Lockout window length in seconds. Default: 15 minutes.
      # KANI_LOGIN_LOCKOUT_SECONDS: "900"

      # Max failed attempts from one IP (across all identities) before IP-level block.
      # KANI_MAX_IP_ATTEMPTS: "20"

      # Set to "false" to prevent new user self-registration. The first admin
      # account is always created automatically on first boot if no users exist.
      # KANI_ALLOW_REGISTRATION: "true"

      # ── Public instance hardening ────────────────────────────────────────────
      # Set to "true" for internet-facing deployments. Forces secure cookies,
      # aggressive rate limits (3 attempts / 15-min lockout), strict CSP, and
      # shows a persistent banner if any admin account lacks 2FA.
      # KANI_PUBLIC_INSTANCE: "false"

      # ── Data directory ───────────────────────────────────────────────────────
      # Where kani stores its database and auto-provisioned key files.
      # Defaults to the process working directory (/data inside Docker).
      # Only needed for non-Docker deployments where the working directory differs.
      # KANI_DATA_DIR: "/data"
    restart: unless-stopped
