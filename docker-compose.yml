services:
  kani:
    build:
      context: .
      # args:
      #   Uncomment to include Chromium + puppeteer-core (~250 MB extra).
      #   Required for browser-based extensions such as kani-comix.
      #   INSTALL_BROWSER: "true"

      #   Uncomment to include Kindle Comic Converter for MOBI/AZW3 export.
      #   INSTALL_KCC: "true"
    image: kani:latest
    ports:
      - "8242:8242"
    volumes:
      # Database and WASM extensions.
      # The kani user inside the container runs as UID 1000.
      # If using a bind mount and you hit permission errors, run:
      #   sudo chown -R 1000:1000 ./data
      - ./data:/data

      # Manga image library. This is kept separate so it can be placed on a
      # different drive or filesystem on the host. To use a custom path, replace
      # the left-hand side with an absolute path, e.g.:
      #   - /mnt/large-drive/manga:/library
      - ./library:/library

    environment:
      KANI_BIND: "0.0.0.0:8242"

      # Set to "true" when running behind a TLS-terminating reverse proxy (Caddy, nginx, etc.)
      # so that session cookies are marked Secure.
      KANI_SECURE_COOKIES: "false"

      # Restrict CORS to a specific origin in production.
      # Leave unset to mirror the request origin (permissive, suitable for local use).
      # KANI_CORS_ORIGIN: "https://kani.example.com"

      # Override the log level (error, warn, info, debug, trace).
      # RUST_LOG: "info"

      # Set to "false" to disable browser-based extension features at runtime,
      # even if Chromium is installed (e.g. to reclaim memory on idle servers).
      # KANI_BROWSER_ENABLED: "false"

      # Override the Chromium binary path if not at the default /usr/bin/chromium.
      # CHROMIUM_PATH: "/usr/bin/chromium-browser"

      # How long (ms) to keep the Chromium process alive after all pages close.
      # Defaults to 300000 (5 min). Set to 0 to keep it alive indefinitely.
      # Lower values save RAM on idle servers at the cost of a ~2 s relaunch delay.
      # BROWSER_IDLE_TIMEOUT_MS: "120000"

      # Encrypt SMTP password and OAuth tokens at rest using ChaCha20-Poly1305.
      # Generate a key with: openssl rand -hex 32
      # Without this variable credentials are stored as plaintext in the database.
      # KANI_SECRET_KEY: ""

      # Alternative — load the key from a Docker secret (recommended for production):
      # KANI_SECRET_KEY_FILE: "/run/secrets/kani_secret_key"
    restart: unless-stopped
