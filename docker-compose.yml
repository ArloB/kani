services:
  kani:
    build:
      context: .
      args:
        # Stamps the image with its commit; .dockerignore excludes .git/, so the
        # build cannot derive it. Export GIT_SHA=$(git rev-parse --short HEAD).
        GIT_SHA: "${GIT_SHA:-}"

        # Enables browser-based extensions; see the engineering constraints register.
        #   INSTALL_BROWSER: "true"

        #   Uncomment to include Kindle Comic Converter for MOBI/AZW3 export.
        #   INSTALL_KCC: "true"
    image: kani:latest
    ports:
      - "8242:8242"
    volumes:
      # Database and WASM extensions. The kani user inside the container runs as UID 1000. If
      # using a bind mount and you hit permission errors, run: sudo chown -R 1000:1000 ./data
      - ./data:/data

      # Manga image library. This is kept separate so it can be placed on a different drive or
      # filesystem on the host. To use a custom path, replace the left-hand side with an absolute
      # path, e.g.: - /mnt/large-drive/manga:/library
      - ./library:/library

    environment:
      KANI_BIND: "0.0.0.0:8242"

      # Set to "true" when running behind a TLS-terminating reverse proxy (Caddy, nginx, etc.)
      # so that session cookies are marked Secure.
      KANI_SECURE_COOKIES: "false"

      # Restrict CORS to a specific origin in production.
      # Leave unset to mirror the request origin (permissive, suitable for local use).
      # KANI_CORS_ORIGIN: "https://kani.example.com"

      # Override the log level (error, warn, info, debug, trace).
      # RUST_LOG: "info"

      # Emit structured JSON logs instead of human-readable text ("text" | "json").
      # KANI_LOG_FORMAT: "json"

      # Warn-log any SQL statement slower than this many milliseconds.
      # KANI_SLOW_QUERY_THRESHOLD_MS: "100"

      # Prometheus metrics disclose extension names, upstream hosts, and error
      # counts. Scrape /metrics with an API token scoped to metrics:read.

      # Shared key sent to the solver on every request. Must match the solver's
      # API_KEY. Leave unset only when the solver is unreachable from elsewhere.
      # KANI_SOLVER_SECRET: "change-me"

      # Signs cover-image proxy URLs. Auto-provisioned to /data/proxy.key on
      # first boot — no action needed unless you want a fixed key across restarts.
      # KANI_PROXY_SECRET: ""   # base64url-encoded 32 bytes

      # How long a session stays alive after last activity. Default: 30 days.
      # KANI_SESSION_TIMEOUT_SECONDS: "2592000"

      # Failed-login lockout: max attempts per identity before a 15-minute block.
      # KANI_MAX_LOGIN_ATTEMPTS: "5"

      # Lockout window length in seconds. Default: 15 minutes.
      # KANI_LOGIN_LOCKOUT_SECONDS: "900"

      # Max failed attempts from one IP (across all identities) before IP-level block.
      # KANI_MAX_IP_ATTEMPTS: "20"

      # Set to "false" to prevent self-registration after initial administrator setup.
      # KANI_ALLOW_REGISTRATION: "true"

      # Marks the deployment as internet-facing so the UI can surface hardened-setup guidance.
      # Security settings still require explicit configuration. KANI_PUBLIC_INSTANCE: "false"

      # Where kani stores its database and auto-provisioned key files. Defaults to the process
      # working directory (/data inside Docker). Only needed for non-Docker deployments where the
      # working directory differs. KANI_DATA_DIR: "/data"
    restart: unless-stopped
