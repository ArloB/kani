[package]
name = "kani-yaml"
version = "0.9.0-rc.1"
edition = "2024"

[lints.clippy]
unwrap_used = { level = "deny", priority = 1 }

[lib]
name = "kani_yaml"
path = "src/lib.rs"

[dependencies]
kani-shared = { path = "../kani-shared", features = ["builder"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
chumsky     = "1.0.0-alpha.8"
thiserror   = "2.0"
rhai        = { version = "1.19", features = ["sync"] }
base64      = "0.22"
semver      = "1"
urlencoding = "2.1"
