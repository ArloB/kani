[package]
name = "kani-shared"
description = "Shared types and traits for Kani."
version = "0.1.0"
edition = "2024"

[dependencies]
wit-bindgen = "0.53.1"
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"], optional = true }
time = { version = "0.3", features = ["serde", "formatting", "macros", "parsing"], optional = true }

[features]
host    = ["dep:serde", "dep:serde_json", "dep:time"]
ssr     = ["dep:sqlx", "host"]
builder = ["dep:serde", "dep:postcard"]
